# Two-update CPU integration smoke for the scientific execution path. This is
# apparatus evidence and carries no acquisition or transfer claim.
[run]
mode = "scientific"
purpose = "apparatus_verification"
entrypoint = "first_training"
cpu_threads = 1
seed = 20260908
dataset_size = 4
max_steps = 2
per_device_train_batch_size = 1
mixed_precision = "fp32"

[system]
version = "calibrated-reach-v1"
seed = 20260908
teacher = "public-history-calibration-teacher-v1"
online_dagger = false
scheduler = "none"

[world]
train_episodes = 4
held_out_episodes = 32
horizon = 12
dt = 0.1
sensor_dims = [8, 10]
action_dims = [2, 4]
goal_modes = ["absolute", "relative"]
goal_switch_steps = [-1, 3]
disturbance_arms = [false, true]
action_limit = 0.5
calibration_pulse = 0.06
observation_noise = 0.0
disturbance_scale = 0.02

[model]
hidden_size = 32
intermediate_size = 64
num_hidden_layers = 1
attention_heads = 2
max_position_embeddings = 128

[train]
batch_size = 1
updates = 2
learning_rate = 0.0002
weight_decay = 0.0
action_loss = "masked_smooth_l1"
future_loss_weight = 0.0

[evaluation]
checkpoints = [0, 1, 2]
closed_loop_checkpoints = [0, 2]
success_tolerance_sensor_rmse = 0.05
success_tolerance_physical = 0.05
teacher_effort_objective = "bounded_residual_plus_minimum_l2"
ablations = ["no_goal"]

[heldout]
seed_start = 100000
seed_count = 32
transform_sensor_permutations = []
transform_body_permutations = []
