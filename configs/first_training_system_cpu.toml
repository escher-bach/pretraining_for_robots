# Apparatus smoke only: two updates, then one resumed update.
# This profile is not a learning or transfer claim.
[run]
mode = "apparatus"
purpose = "apparatus_verification"
cpu_threads = 1
seed = 17
dataset_size = 8
learning_rate = 0.0002
weight_decay = 0.0
max_grad_norm = 1.0
smoke_steps = 2
resumed_steps = 3

[model]
hidden_size = 64
intermediate_size = 128
num_hidden_layers = 2
attention_heads = 4
max_position_embeddings = 128

[world]
train_episodes = 64
held_out_episodes = 32
horizon = 12
dt = 0.1
sensor_dims = [8, 10]
action_dims = [2, 4]
goal_modes = ["absolute", "relative"]
goal_switch_steps = [-1, 3]
disturbance_arms = [false, true]
action_limit = 0.5
calibration_pulse = 0.06
observation_noise = 0.0
disturbance_scale = 0.02

[evaluation]
checkpoints = [0, 2, 3]
closed_loop_checkpoints = [0, 3]
success_tolerance_sensor_l2 = 0.05
success_tolerance_physical = 0.05
teacher_effort_objective = "bounded_residual_plus_minimum_l2"
